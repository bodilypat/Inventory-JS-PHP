<!-- ============================================================
     INVENTORY MANAGEMENT SYSTEM
     Reusable Modal Component

     File:
     frontend/components/modal.html

     Usage:
     - Create
     - Edit
     - View
     - Delete confirmation
     - Custom forms
     - Notifications / confirmations

     The modal is intentionally empty of business/mock data.
     JavaScript should populate the dynamic content.
     ============================================================ -->


<!-- ============================================================
     MAIN MODAL
     ============================================================ -->

<div
    class="modal"
    id="appModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    aria-describedby="modalDescription"
    hidden>

    <div
        class="modal-dialog"
        id="modalDialog">


        <!-- ====================================================
             MODAL HEADER
             ==================================================== -->

        <div class="modal-header">

            <div>

                <h2
                    class="modal-title"
                    id="modalTitle">
                    Modal
                </h2>

                <p
                    class="card-subtitle"
                    id="modalDescription">
                </p>

            </div>


            <!-- Close -->
            <button
                type="button"
                class="modal-close"
                id="modalCloseButton"
                aria-label="Close modal"
                title="Close">

                <span aria-hidden="true">
                    ×
                </span>

            </button>

        </div>


        <!-- ====================================================
             MODAL BODY
             ==================================================== -->

        <div
            class="modal-body"
            id="modalBody">

            <!-- Dynamic content is inserted here -->

        </div>


        <!-- ====================================================
             MODAL FOOTER
             ==================================================== -->

        <div
            class="modal-footer"
            id="modalFooter">

            <!--
                Buttons are dynamically inserted by JavaScript.
            -->

            <button
                type="button"
                class="btn btn-outline"
                id="modalCancelButton">

                Cancel

            </button>

            <button
                type="button"
                class="btn btn-primary"
                id="modalConfirmButton">

                Confirm

            </button>

        </div>

    </div>

</div>



<!-- ============================================================
     DELETE CONFIRMATION MODAL
     ============================================================ -->

<div
    class="modal"
    id="deleteModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deleteModalTitle"
    aria-describedby="deleteModalDescription"
    hidden>

    <div class="modal-dialog">


        <!-- Header -->
        <div class="modal-header">

            <div>

                <h2
                    class="modal-title"
                    id="deleteModalTitle">

                    Confirm Delete

                </h2>

                <p
                    class="card-subtitle">

                    This action cannot be undone.

                </p>

            </div>


            <button
                type="button"
                class="modal-close"
                id="deleteModalCloseButton"
                aria-label="Close delete confirmation">

                <span aria-hidden="true">
                    ×
                </span>

            </button>

        </div>


        <!-- Body -->
        <div class="modal-body">

            <div
                class="delete-confirmation"
                id="deleteModalDescription">

                <div
                    class="empty-state-icon"
                    aria-hidden="true">

                    ⚠️

                </div>

                <h3>
                    Are you sure?
                </h3>

                <p class="text-secondary">
                    The selected record will be permanently deleted.
                </p>

                <p
                    id="deleteRecordName"
                    class="text-danger"
                    style="font-weight: 600;">
                </p>

            </div>

        </div>


        <!-- Footer -->
        <div class="modal-footer">

            <button
                type="button"
                class="btn btn-outline"
                id="deleteModalCancelButton">

                Cancel

            </button>

            <button
                type="button"
                class="btn btn-danger"
                id="deleteModalConfirmButton">

                Delete

            </button>

        </div>

    </div>

</div>



<!-- ============================================================
     FORM MODAL TEMPLATE
     ============================================================ -->

<template id="formModalTemplate">

    <form
        id="dynamicModalForm"
        novalidate>

        <div
            id="dynamicFormFields"
            class="grid gap-4">

            <!-- Dynamic form fields -->

        </div>

    </form>

</template>



<!-- ============================================================
     VIEW / DETAILS MODAL TEMPLATE
     ============================================================ -->

<template id="detailsModalTemplate">

    <div
        class="details-modal-content"
        id="detailsModalContent">

        <!-- Dynamic details -->

    </div>

</template>



<!-- ============================================================
     ALERT / CONFIRMATION TEMPLATE
     ============================================================ -->

<template id="alertModalTemplate">

    <div
        class="empty-state">

        <div
            class="empty-state-icon"
            id="alertModalIcon"
            aria-hidden="true">
        </div>

        <h3
            id="alertModalTitle"
            class="empty-state-title">
        </h3>

        <p
            id="alertModalMessage"
            class="empty-state-description">
        </p>

    </div>

</template>
